<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Proyecto RXI</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    
    <a-scene cursor="rayOrigin: mouse" raycaster="objects: .clickable">

      
      <a-assets>
        <a-asset-item id="silla" src="assets/models/silla.glb"></a-asset-item>
        <a-asset-item id="test" src="assets/models/prueba_exportacion.glb"></a-asset-tem>
        <a-asset-item id="oveja" src="assets/models/oveja.glb"></a-asset-item>  
      </a-assets>


        <a-entity class="clickable" gltf-model="#silla"
        position="-1.5 0 -3" rotation="0 35 0"
        animation__enter="property: scale; to: 1.2 1.2 1.2; dur: 200; startEvents:mouseenter"
        animation__leave="property: scale; to: 1 1 1; dur: 200; startEvents: mouseleave"
        animation__click="property: rotation; from: 0 35 0; to: 0 395 0; dur: 1000; startEvents: click"
        ></a-entity>

        <a-entity class="clickable" gltf-model="#test"
        position="2 0 3" rotation="0 35 0"
        animation__enter="property: scale; to: 1.2 1.2 1.2; dur: 200; startEvents:mouseenter"
        animation__leave="property: scale; to: 1 1 1; dur: 200; startEvents: mouseleave"
        animation__click="property: rotation; from: 0 35 0; to: 0 395 0; dur: 1000; startEvents: click"
        ></a-entity>

        <a-entity class="clickable" gltf-model="#oveja"
        position="-6 0 4" rotation="0 35 0"
        animation__enter="property: scale; to: 1.2 1.2 1.2; dur: 200; startEvents:mouseenter"
        animation__leave="property: scale; to: 1 1 1; dur: 200; startEvents: mouseleave"
        ></a-entity>

          <a-plane rotation="-90 0 0" width="100" height="100" color="#78C8A4"></a-plane>
          <a-sky color="#222D62"></a-sky>

      <a-entity light="type: ambient; intensity: 0.6"></a-entity>
      <a-entity light="type: directional; intensity: 0.8" position="-1 2 1"></a-entity>

    </a-scene>
  </body>
</html>
