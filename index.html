<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Proyecto RXI</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

    <script>
      /* ---------- Clonado de modelos con esqueleto ---------- */
      function cloneSkinned(source) {
        const THREE = AFRAME.THREE;
        if (THREE.SkeletonUtils && THREE.SkeletonUtils.clone) {
          return THREE.SkeletonUtils.clone(source);
        }
        const clone = source.clone();
        const nodeMap = new Map();
        const srcNodes = [];
        const cloneNodes = [];
        source.traverse(n => srcNodes.push(n));
        clone.traverse(n => cloneNodes.push(n));
        srcNodes.forEach((n, i) => nodeMap.set(n, cloneNodes[i]));
        srcNodes.forEach((srcNode, i) => {
          if (!srcNode.isSkinnedMesh) return;
          const bones = srcNode.skeleton.bones.map(b => nodeMap.get(b));
          cloneNodes[i].bind(
            new THREE.Skeleton(bones, srcNode.skeleton.boneInverses),
            srcNode.bindMatrix
          );
        });
        return clone;
      }

      /* ---------- Corral (valla circular) ---------- */
      AFRAME.registerComponent('corral', {
        schema: {
          radius: { default: 6 },
          height: { default: 1 },
          posts:  { default: 32 },
          color:  { default: '#8b5a2b' }
        },

        update() {
          this.clear();
          const THREE = AFRAME.THREE;
          const d = this.data;
          const group = new THREE.Group();
          const mat = new THREE.MeshStandardMaterial({ color: d.color, roughness: 0.9 });

          const postGeo = new THREE.CylinderGeometry(0.06, 0.06, d.height, 8);
          for (let i = 0; i < d.posts; i++) {
            const a = (i / d.posts) * Math.PI * 2;
            const post = new THREE.Mesh(postGeo, mat);
            post.position.set(Math.cos(a) * d.radius, d.height / 2, Math.sin(a) * d.radius);
            group.add(post);
          }

          const railGeo = new THREE.TorusGeometry(d.radius, 0.03, 6, 96);
          [0.35, 0.8].forEach(f => {
            const rail = new THREE.Mesh(railGeo, mat);
            rail.rotation.x = Math.PI / 2;
            rail.position.y = d.height * f;
            group.add(rail);
          });

          this.el.setObject3D('corral', group);
          this._disposables = [postGeo, railGeo, mat];
        },

        clear() {
          if (this.el.getObject3D('corral')) this.el.removeObject3D('corral');
          (this._disposables || []).forEach(x => x.dispose());
          this._disposables = [];
        },

        remove() { this.clear(); }
      });

      /* ---------- Rebaño con colisiones ---------- */
      AFRAME.registerComponent('flock', {
        schema: {
          source:     { type: 'selector' },
          count:      { default: 20 },
          radius:     { default: 6 },      // debe coincidir con el radio del corral
          bodyRadius: { default: 0.5 },    // radio de colisión de una oveja (sin escalar)
          scaleMin:   { default: 0.8 },
          scaleMax:   { default: 1.2 },
          speed:      { default: 0.6 },
          clip:       { default: '' },
          faceOffset: { default: 0 },      // prueba 3.1416 si caminan hacia atrás
          stuckTime:  { default: 12 },
          debug:      { default: false }   // anillo rojo = círculo de colisión
        },

        init() {
          this.sheep = [];

          const src = this.data.source;
          if (!src) { console.error('[flock] source no encontrado'); return; }

          const go = () => this.build(src.getObject3D('mesh'));
          if (src.getObject3D('mesh')) go();
          else src.addEventListener('model-loaded', go, { once: true });

          // Balido posicional en la oveja clicada
          this.el.addEventListener('click', (evt) => {
            const hit = evt.detail && evt.detail.intersection;
            const snd = document.querySelector('#snd-oveja');
            if (!hit || !snd || !snd.components.sound) return;
            snd.object3D.position.copy(hit.point);
            snd.components.sound.stopSound();
            snd.components.sound.playSound();
          });
        },

        randomPoint(limit) {
          const a = Math.random() * Math.PI * 2;
          const r = Math.sqrt(Math.random()) * Math.max(limit, 0);
          return { x: Math.cos(a) * r, z: Math.sin(a) * r };
        },

        spawnPoint(placed) {
          const d = this.data;
          const rMax = d.bodyRadius * d.scaleMax;
          const limit = d.radius - rMax;
          for (let t = 0; t < 40; t++) {
            const p = this.randomPoint(limit);
            if (placed.every(q => Math.hypot(q.x - p.x, q.z - p.z) > 2 * rMax)) return p;
          }
          return this.randomPoint(limit);
        },

        build(model) {
          const THREE = AFRAME.THREE;
          const d = this.data;
          const clips = model.animations || [];
          const clip = clips.find(c => c.name === d.clip) || clips[0];
          console.log('[flock] clips en el GLB:', clips.map(c => c.name));

          const density = (d.count * Math.pow(d.bodyRadius * d.scaleMax, 2)) / (d.radius * d.radius);
          if (density > 0.4) {
            console.warn('[flock] corral muy lleno (' + (density * 100).toFixed(0) +
              '% del área). Reduce count/bodyRadius o aumenta radius.');
          }

          let ringGeo = null, ringMat = null;
          if (d.debug) {
            ringGeo = new THREE.RingGeometry(d.bodyRadius - 0.03, d.bodyRadius, 32);
            ringMat = new THREE.MeshBasicMaterial({ color: 0xff3333, side: THREE.DoubleSide });
          }

          const placed = [];
          for (let i = 0; i < d.count; i++) {
            const obj = cloneSkinned(model);
            const scale = d.scaleMin + Math.random() * (d.scaleMax - d.scaleMin);
            const r = d.bodyRadius * scale;

            const p = this.spawnPoint(placed);
            placed.push(p);

            obj.position.set(p.x, 0, p.z);
            obj.rotation.y = Math.random() * Math.PI * 2;
            obj.scale.setScalar(scale);
            obj.visible = true;

            if (d.debug) {
              const ring = new THREE.Mesh(ringGeo, ringMat);
              ring.rotation.x = -Math.PI / 2;
              ring.position.y = 0.03;
              ring.raycast = () => {};
              obj.add(ring);
            }

            this.el.setObject3D('sheep' + i, obj);

            let mixer = null;
            if (clip) {
              mixer = new THREE.AnimationMixer(obj);
              const action = mixer.clipAction(clip);
              action.time = Math.random() * clip.duration;
              action.play();
            }

            this.sheep.push({
              obj, mixer, r,
              target: this.randomPoint(d.radius - r),
              speed: d.speed * (0.7 + Math.random() * 0.6),
              wait: Math.random() * 3,
              walk: 0
            });
          }
        },

        tick(time, dtMs) {
          const d = this.data;
          const S = this.sheep;
          const n = S.length;
          if (!n) return;
          const dt = Math.min(dtMs, 100) / 1000;

          // 1) Movimiento voluntario
          for (let i = 0; i < n; i++) {
            const s = S[i];
            if (s.mixer) s.mixer.update(dt);

            if (s.wait > 0) { s.wait -= dt; continue; }

            const o = s.obj;
            const dx = s.target.x - o.position.x;
            const dz = s.target.z - o.position.z;
            const dist = Math.hypot(dx, dz);

            s.walk += dt;
            if (dist < 0.3 || s.walk > d.stuckTime) {
              s.wait = 1 + Math.random() * 4;
              s.walk = 0;
              s.target = this.randomPoint(d.radius - s.r);
              continue;
            }

            let diff = Math.atan2(dx, dz) + d.faceOffset - o.rotation.y;
            diff = Math.atan2(Math.sin(diff), Math.cos(diff));
            o.rotation.y += diff * Math.min(1, dt * 4);

            o.position.x += (dx / dist) * s.speed * dt;
            o.position.z += (dz / dist) * s.speed * dt;
          }

          // 2) Colisiones: oveja-oveja y valla (la valla va última y siempre gana)
          for (let iter = 0; iter < 2; iter++) {
            for (let i = 0; i < n; i++) {
              const a = S[i].obj.position;
              for (let j = i + 1; j < n; j++) {
                const b = S[j].obj.position;
                const dx = b.x - a.x;
                const dz = b.z - a.z;
                const dist = Math.hypot(dx, dz);
                const min = S[i].r + S[j].r;
                if (dist >= min) continue;

                let nx, nz, push;
                if (dist < 1e-4) { nx = 1; nz = 0; push = min / 2; }
                else { nx = dx / dist; nz = dz / dist; push = (min - dist) / 2; }

                a.x -= nx * push; a.z -= nz * push;
                b.x += nx * push; b.z += nz * push;
              }
            }

            for (let i = 0; i < n; i++) {
              const p = S[i].obj.position;
              const lim = d.radius - S[i].r;
              const dist = Math.hypot(p.x, p.z);
              if (dist > lim) {
                const k = lim / dist;
                p.x *= k;
                p.z *= k;
              }
            }
          }
        },

        remove() {
          for (let i = 0; i < this.sheep.length; i++) this.el.removeObject3D('sheep' + i);
          this.sheep.length = 0;
        }
      });
    </script>
  </head>
  <body>

    <a-scene cursor="rayOrigin: mouse" raycaster="objects: .clickable">

      <a-assets>
        <a-asset-item id="silla" src="assets/models/silla.glb"></a-asset-item>
        <a-asset-item id="saco" src="assets/models/saco.glb"></a-asset-item>
        <a-asset-item id="oveja" src="assets/models/oveja.glb"></a-asset-item>
        <a-asset-item id="balde" src="assets/models/balde.glb"></a-asset-item>
        <a-asset-item id="barril" src="assets/models/barril.glb"></a-asset-item>
        <audio id="sound-ambiente" src="assets/audio/ambiente.mp3" preload="auto" crossorigin="anonymous"></audio>
        <audio id="sound-oveja" src="assets/audio/oveja.mp3" preload="auto"></audio>
      </a-assets>

      <!-- Cámara (sin sonido propio ni camera-boundary, que no existe en A-Frame) -->
      <a-entity camera="fov: 60" look-controls wasd-controls
        position="1 1.3 3"
        light="type: spot; color: #FFFFFF; intensity: 3; angle: 35; penumbra: 0.5; distance: 15">
      </a-entity>

      <!-- Sonido ambiente (un solo punto de reproducción) -->
      <a-entity id="ambiente"
        sound="src: #sound-ambiente; autoplay: true; loop: true; volume: 0.5; positional: false"></a-entity>

      <!-- ===== Objetos originales ===== -->
      <a-entity class="clickable" gltf-model="#silla"
        position="-1.5 0 -3" rotation="0 35 0"
        animation__enter="property: scale; to: 1.2 1.2 1.2; dur: 200; startEvents:mouseenter"
        animation__leave="property: scale; to: 1 1 1; dur: 200; startEvents: mouseleave"
        animation__click="property: rotation; from: 0 35 0; to: 0 395 0; dur: 1000; startEvents: click"
      ></a-entity>

      <a-entity class="clickable" gltf-model="#saco"
        position="2 0 4" rotation="0 35 0"
        animation__enter="property: scale; to: 1.2 1.2 1.2; dur: 200; startEvents:mouseenter"
        animation__leave="property: scale; to: 1 1 1; dur: 200; startEvents: mouseleave"
        animation__click="property: rotation; from: 0 35 0; to: 0 395 0; dur: 1000; startEvents: click"
      ></a-entity>

      <!-- Oveja protagonista -->
      <a-entity class="clickable" gltf-model="#oveja"
        position="-6 0 4" rotation="0 35 0"
        animation__enter="property: scale; to: 1.2 1.2 1.2; dur: 200; startEvents:mouseenter"
        animation__leave="property: scale; to: 1 1 1; dur: 200; startEvents: mouseleave"
        sound="src: #sound-oveja; on: click; positional: true"
      ></a-entity>

      <a-entity class="clickable" gltf-model="#balde"
        position="2 0 2" rotation="0 35 0"
        animation__enter="property: scale; to: 1.2 1.2 1.2; dur: 200; startEvents:mouseenter"
        animation__leave="property: scale; to: 1 1 1; dur: 200; startEvents: mouseleave"
        animation__click="property: rotation; from: 0 35 0; to: 0 395 0; dur: 1000; startEvents: click"
      ></a-entity>

      <a-entity class="clickable" gltf-model="#barril"
        position="5 0 2" rotation="0 35 0"
        animation__enter="property: scale; to: 1.2 1.2 1.2; dur: 200; startEvents:mouseenter"
        animation__leave="property: scale; to: 1 1 1; dur: 200; startEvents: mouseleave"
      ></a-entity>

      <!-- ===== Corral + rebaño =====
           IMPORTANTE: corral y rebaño con el MISMO radius y la MISMA position. -->

      <!-- Fuente: oculta, sin clickable; solo aporta el modelo cargado -->
      <a-entity id="sheep-src" gltf-model="#oveja" visible="false"></a-entity>

      <!-- Valla -->
      <a-entity corral="radius: 6" position="-8 0 -10"></a-entity>

      <!-- Rebaño (pon debug: false cuando termines de ajustar bodyRadius) -->
      <a-entity id="rebano" class="clickable"
        flock="source: #sheep-src; count: 20; radius: 6; bodyRadius: 0.5; speed: 0.6; debug: true"
        position="-8 0 -10"></a-entity>

      <!-- Sonido que se reposiciona en la oveja clicada -->
      <a-entity id="snd-oveja" sound="src: #sound-oveja; positional: true"></a-entity>

      <!-- ===== Entorno ===== -->
      <a-plane rotation="-90 0 0" width="100" height="100" color="#78C8A4"></a-plane>
      <a-sky color="#87CEEB"></a-sky>

      <a-entity light="type: ambient; intensity: 0.6"></a-entity>
      <a-entity light="type: directional; intensity: 0.8" position="-1 2 1"></a-entity>

    </a-scene>

    <script>
      // Respaldo para la política de autoplay: si el ambiente no arrancó solo,
      // se inicia con la primera interacción del usuario.
      let ambienteIniciado = false;
      function iniciarAmbiente() {
        if (ambienteIniciado) return;
        ambienteIniciado = true;
        const ctx = AFRAME.THREE.AudioContext.getContext();
        if (ctx.state === 'suspended') ctx.resume();
        const s = document.querySelector('#ambiente');
        if (s && s.components.sound && !s.components.sound.isPlaying) {
          s.components.sound.playSound();
        }
      }
      ['click', 'keydown', 'touchstart'].forEach(ev =>
        window.addEventListener(ev, iniciarAmbiente, { once: true })
      );
    </script>
  </body>
</html>
